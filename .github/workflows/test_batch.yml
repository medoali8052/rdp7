name: Free Real Kali Linux RDP v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. تحويل النظام إلى مستودعات كالي وتثبيت الواجهة بشكل مخفف وسريع
      - name: Transform to Kali Linux (Light Mode)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg wget
          
          # إضافة مستودعات كالي الرسمية
          wget -q -O - https://archive.kali.org/archive-key.asc | sudo apt-key add -
          echo "deb http://http.kali.org/kali kali-rolling main contrib non-free non-free-firmware" | sudo tee /etc/apt/sources.list
          
          sudo apt-get update
          
          # تثبيت الواجهة والخادم مع خيار منع تحميل الحزم غير الضرورية لتسريع العملية ومنع الكراش
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xfce4 xfce4-goodies xrdp kali-themes kali-defaults
          
          # إعداد الجلسة وتشغيل الـ RDP
          echo xfce4-session > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      # 2. تثبيت الحزم الأساسية للاختراق (أهم 10 أدوات فقط بدلاً من التوزيعة كاملة)
      - name: Install Essential Kali Tools
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nmap curl wget git net-tools

      # 3. تثبيت أداة Tailscale
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      # 4. الربط بشبكة تايل سكيل
      - name: Connect to Tailscale Network
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes --hostname=Kali-Light-Server

      # 5. تعيين كلمة مرور مستخدم الـ RDP
      - name: Setup User Password
        run: |
          echo "runner:KaliRDP@2026" | sudo chpasswd

      # 6. الحفاظ على تشغيل السيرفر حياً
      - name: Keep Alive Loop
        run: |
          echo "=========================================================="
          echo "Kali Linux Light is ready!"
          echo "Connect via RDP using Tailscale IP."
          echo "Username: runner"
          echo "Password: KaliRDP@2026"
          echo "=========================================================="
          
          hours=6
          for ((i=0; i<(hours*60); i++)); do
              sleep 60
          done
