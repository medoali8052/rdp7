name: Free Kali Linux RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. تحديث النظام وتثبيت أدوات كالي والواجهة الرسومية وخادم RDP
      - name: Install Kali Tools, Desktop Environment and XRDP
        run: |
          sudo apt-get update
          
          # تثبيت الواجهة الرسومية الخفيفة (XFCE) وخادم الـ RDP صامتاً
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp
          
          # إعداد نظام التشغيل الافتراضي ليكون واجهة XFCE عند الاتصال بالـ RDP
          echo xfce4-session > ~/.xsession
          
          # تشغيل وتفعيل خدمة الـ RDP
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          
          # إضافة أدوات كالي لينكس الأساسية للشبكات والفحص
          sudo apt-get install -y curl wget git net-tools nmap

      # 2. تثبيت أداة Tailscale الرسمية لنظام اللينكس
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      # 3. الربط بالشبكة وتفعيل الحساب (تم حذف --unattended هنا)
      - name: Connect to Tailscale Network
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes --hostname=Kali-GitHub-Server

      # 4. تعيين كلمة مرور لمستخدم السيرفر لتتمكن من تسجيل الدخول بها عبر الـ RDP
      - name: Setup Linux User Password
        run: |
          # اسم المستخدم الافتراضي في جيت هوب لينكس هو 'runner'
          echo "runner:KaliRDP@2026" | sudo chpasswd

      # 5. الحفاظ على تشغيل السيرفر حياً طوال الـ 6 ساعات
      - name: Keep Alive Loop
        run: |
          echo "=========================================================="
          echo "Kali Linux is running and connected to Tailscale!"
          echo "Use your Tailscale IP to connect via Remote Desktop (RDP)."
          echo "Username: runner"
          echo "Password: KaliRDP@2026"
          echo "=========================================================="
          
          # حلقة الحفاظ على التشغيل حياً (6 ساعات)
          hours=6
          for ((i=0; i<(hours*60); i++)); do
              sleep 60
          done
