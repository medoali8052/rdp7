name: Free Real Kali Linux RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. تحويل النظام رسميًا إلى مستودعات كالي لينكس وتثبيت الثيم والواجهة الأصلية
      - name: Transform to Official Kali Linux and Setup Desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg wget
          
          # إضافة مفتاح ومستودعات كالي لينكس الرسمية (Kali Repositories)
          wget -q -O - https://archive.kali.org/archive-key.asc | sudo apt-key add -
          echo "deb http://http.kali.org/kali kali-rolling main contrib non-free non-free-firmware" | sudo tee /etc/apt/sources.list
          
          # تحديث الحزم لقراءة مستودع كالي الجديد
          sudo apt-get update
          
          # تثبيت واجهة كالي الرسمية وثيمات التنين صامتاً (Kali Desktop Environment)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kali-desktop-xfce xrdp
          
          # إعداد الجلسة الافتراضية للـ RDP
          echo xfce4-session > ~/.xsession
          
          # تفعيل وتشغيل خادم الـ RDP
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      # 2. تثبيت الحزمة الأساسية لأدوات كالي لينكس (Kali Linux Core Tools)
      - name: Install Kali Linux Core Tools
        run: |
          # تثبيت الأدوات الرئيسية لكالي (تستغرق دقائق قليلة لضمان استقرار السيرفر)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y kali-tools-top10

      # 3. تثبيت أداة Tailscale
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      # 4. الربط بشبكة تايل سكيل
      - name: Connect to Tailscale Network
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes --hostname=Real-Kali-Server

      # 5. تعيين كلمة مرور مستخدم الـ RDP
      - name: Setup User Password
        run: |
          echo "runner:KaliRDP@2026" | sudo chpasswd

      # 6. الحفاظ على تشغيل السيرفر حياً
      - name: Keep Alive Loop
        run: |
          echo "=========================================================="
          echo "Real Kali Linux is running with official theme!"
          echo "Connect via Remote Desktop (RDP) using Tailscale IP."
          echo "Username: runner"
          echo "Password: KaliRDP@2026"
          echo "=========================================================="
          
          hours=6
          for ((i=0; i<(hours*60); i++)); do
              sleep 60
          done
