name: Free Official Kali Linux Docker RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. تثبيت خادم الـ RDP وأدوات العرض على النظام المستضيف
      - name: Setup Remote Desktop Service
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xrdp xfce4 xfce4-goodies
          echo xfce4-session > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          
          # تعيين كلمة مرور للمستخدم runner
          echo "runner:KaliRDP@2026" | sudo chpasswd

      # 2. تشغيل حاوية كالي لينكس الرسمية في الخلفية مع ربطها بـ Tailscale
      - name: Launch Official Kali Linux Container and Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # تثبيت تايل سكيل على النظام المستضيف للربط
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes --hostname=Kali-Docker-Server
          
          # سحب وتشغيل حاوية كالي لينكس الرسمية بكامل صلاحيات الشبكة والتفاعل
          sudo docker run -d --name kali-core --net=host --privileged -v /:/host kalilinux/kali-rolling:latest sleep infinity
          
          # تحديث مستودعات الحاوية وتثبيت أدوات الفحص الأساسية لكالي بالداخل
          sudo docker exec kali-core apt-get update
          sudo docker exec kali-core apt-get install -y kali-tools-top10 curl wget git net-tools nmap

      # 3. الحفاظ على تشغيل السيرفر حياً
      - name: Keep Alive Loop
        run: |
          echo "=========================================================="
          echo "🚀 Real Kali Linux Container is Live & Connected!"
          echo "Connect via Windows RDP using your Tailscale IP."
          echo "Username: runner"
          echo "Password: KaliRDP@2026"
          echo "=========================================================="
          
          hours=6
          for ((i=0; i<(hours*60); i++)); do
              sleep 60
          done
